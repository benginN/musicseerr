<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musicseerr</title>
<style>
  :root { --bg: #1a1b26; --box: #23242f; --fg: #d5d6dd; --dim: #8a8d98; --accent: #7aa2f7; --green: #9ece6a; --red: #f7768e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 1.2rem; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  h1 small { color: var(--dim); font-weight: normal; font-size: 0.8rem; margin-left: 0.6rem; }
  .modes { display: flex; gap: 0.4rem; margin-bottom: 0.7rem; }
  .modes button { border: 1px solid #3a3c4a; background: var(--box); color: var(--dim); border-radius: 999px; padding: 0.3rem 0.95rem; cursor: pointer; font-size: 0.9rem; }
  .modes button.active { background: var(--accent); color: #16161e; border-color: var(--accent); font-weight: 600; }
  .search { display: flex; gap: 0.6rem; margin-bottom: 1.2rem; }
  .search input { flex: 1; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid #3a3c4a; background: var(--box); color: var(--fg); font-size: 1rem; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search button { padding: 0.65rem 1.1rem; border-radius: 8px; border: none; background: var(--accent); color: #16161e; font-weight: 600; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.8rem; }
  .card { background: var(--box); border-radius: 10px; padding: 0.7rem; display: flex; gap: 0.7rem; align-items: center; }
  .card img { width: 3.4rem; height: 3.4rem; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .card.click { cursor: pointer; } .card.click:hover { outline: 1px solid var(--accent); }
  .card .info { min-width: 0; flex: 1; }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { color: var(--dim); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card button, .btn { border: none; background: #2f3140; color: var(--fg); border-radius: 8px; padding: 0.45rem 0.6rem; cursor: pointer; font-size: 0.95rem; flex-shrink: 0; }
  .card button:hover, .btn:hover { background: var(--accent); color: #16161e; }
  .card button:disabled { cursor: default; background: #2f3140; }
  .artist-head { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .artist-head img { width: 4.6rem; height: 4.6rem; border-radius: 50%; object-fit: cover; }
  .artist-head .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  h2 { font-size: 1rem; color: var(--dim); margin: 1.6rem 0 0.6rem; }
  .queue .row { display: flex; gap: 0.7rem; align-items: baseline; padding: 0.35rem 0; border-bottom: 1px solid #2a2c38; font-size: 0.9rem; }
  .queue .status { flex-shrink: 0; width: 7.5rem; }
  .queue .what { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue .when { color: var(--dim); font-size: 0.8rem; flex-shrink: 0; }
  .ok { color: var(--green); } .err { color: var(--red); } .busy { color: var(--accent); }
  .note { color: var(--dim); font-size: 0.85rem; }
  .toast { position: fixed; top: 1rem; right: 1rem; background: var(--box); border: 1px solid var(--accent); border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.9rem; display: none; max-width: 22rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 musicseerr <small>search → pick → it shows up in your library</small></h1>
  <div class="modes" id="modes">
    <button data-mode="track" class="active">Track</button>
    <button data-mode="album">Album</button>
    <button data-mode="artist">Artist</button>
    <button data-mode="csv">📄 CSV</button>
  </div>
  <form class="search" id="searchForm">
    <input id="searchBox" type="search" placeholder="Search a track or artist… (Deezer)" autofocus>
    <button type="submit">Search</button>
  </form>
  <div id="results"><div class="note">⏳ loading popular tracks…</div></div>
  <h2>Queue &amp; recent downloads</h2>
  <div class="queue" id="queue"><div class="note">—</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const resultsEl = document.getElementById("results");
const queueEl = document.getElementById("queue");
const toastEl = document.getElementById("toast");
let mode = "track";
const STATUS_TEXT = {
  "queued": ["⏳ queued", "busy"], "downloading": ["⬇️ downloading", "busy"],
  "done": ["✅ downloaded", "ok"], "exists": ["✔ already there", "ok"], "error": ["⚠️ error", "err"],
};
const PLACEHOLDER = { track: "Search a track or artist… (Deezer)", album: "Search an album…", artist: "Search an artist…" };

function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmtDur(sec) { return sec ? Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0") : ""; }
function coverSrc(u) { return u ? "/api/cover?u=" + encodeURIComponent(u) : ""; }
function toast(m) {
  toastEl.textContent = m; toastEl.style.display = "block";
  clearTimeout(toastEl._t); toastEl._t = setTimeout(() => toastEl.style.display = "none", 6000);
}

// ── track cards ──
function drawTracks(el, results) {
  el.innerHTML = '<div class="grid">' + results.map(t => `
    <div class="card">
      <img src="${coverSrc(t.cover)}" alt="" loading="lazy">
      <div class="info">
        <div class="name" title="${esc(t.title)}">${esc(t.title)}</div>
        <div class="sub" title="${esc(t.artist)} · ${esc(t.album)}">${esc(t.artist)} · ${esc(t.album)} ${t.duration ? "· " + fmtDur(t.duration) : ""}</div>
      </div>
      ${t.exists ? '<button disabled title="Already in your library">✔</button>'
                 : `<button data-id="${t.deezer_id}" title="Download to your library">⬇</button>`}
    </div>`).join("") + "</div>";
  el.querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => downloadOne(b)));
}

async function downloadOne(btn) {
  btn.disabled = true; btn.textContent = "⏳";
  try {
    const r = await fetch("/api/download", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deezer_id: Number(btn.dataset.id) }) });
    if (!r.ok) throw 0;
    watch((await r.json()).job_id, btn);
  } catch { btn.textContent = "⚠️"; btn.disabled = false; }
  refreshQueue();
}

function watch(jobId, btn) {
  const timer = setInterval(async () => {
    try {
      const d = await (await fetch("/api/job/" + jobId)).json();
      if (d.status === "done" || d.status === "exists") { btn.textContent = "✅"; clearInterval(timer); refreshQueue(); }
      else if (d.status === "error") { btn.textContent = "⚠️"; btn.title = d.error || "error"; clearInterval(timer); refreshQueue(); }
    } catch {}
  }, 4000);
  setTimeout(() => clearInterval(timer), 15 * 60 * 1000);
}

// ── bulk download button (album / artist / list) ──
async function bulkDownload(btn, url, body, label) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "⏳";
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw 0;
    const d = await r.json();
    btn.textContent = d.added > 0 ? "✅" : "✔";
    toast(`${label}: ${d.added} track(s) queued` + (d.skipped ? `, ${d.skipped} already there/queued` : "") + (d.album_count ? ` (${d.album_count} albums)` : ""));
    refreshQueue();
  } catch { btn.textContent = "⚠️"; btn.disabled = false; toast("⚠️ could not queue: " + label); }
  if (btn.textContent === "⚠️") btn.textContent = old;
}

// ── album cards ──
function drawAlbums(el, results) {
  el.innerHTML = '<div class="grid">' + results.map(a => `
    <div class="card">
      <img src="${coverSrc(a.cover)}" alt="" loading="lazy">
      <div class="info">
        <div class="name" title="${esc(a.title)}">${esc(a.title)}</div>
        <div class="sub">${esc(a.artist)} · ${a.track_count} tracks${a.year ? " · " + a.year : ""}${a.record_type && a.record_type !== "album" ? " · " + esc(a.record_type) : ""}</div>
      </div>
      <button data-album="${a.album_id}" data-name="${esc(a.title)}" title="Download the whole album">⬇ album</button>
    </div>`).join("") + "</div>";
  el.querySelectorAll("button[data-album]").forEach(b =>
    b.addEventListener("click", () => bulkDownload(b, "/api/download-album", { album_id: Number(b.dataset.album) }, b.dataset.name)));
}

// ── artist cards + artist page ──
function drawArtists(el, results) {
  el.innerHTML = '<div class="grid">' + results.map(a => `
    <div class="card click" data-artist="${a.artist_id}">
      <img src="${coverSrc(a.picture)}" alt="" loading="lazy" style="border-radius:50%">
      <div class="info"><div class="name">${esc(a.name)}</div><div class="sub">open page →</div></div>
    </div>`).join("") + "</div>";
  el.querySelectorAll("[data-artist]").forEach(c =>
    c.addEventListener("click", () => openArtist(Number(c.dataset.artist))));
}

async function openArtist(id) {
  resultsEl.innerHTML = '<div class="note">⏳ loading artist page…</div>';
  try {
    const d = await (await fetch("/api/artist/" + id)).json();
    resultsEl.innerHTML = `
      <div class="artist-head">
        <img src="${coverSrc(d.picture)}" alt="">
        <div>
          <div class="name" style="font-size:1.15rem; font-weight:700;">${esc(d.name)}</div>
          <div class="btns" style="margin-top:0.4rem;">
            <button class="btn" id="topBtn">🔝 Download top 25</button>
            <button class="btn" id="allBtn" title="All albums + EPs — singles excluded">💿 Download all albums</button>
            <button class="btn" id="backBtn">← back to search</button>
          </div>
        </div>
      </div>
      <h2>Albums</h2><div id="aAlbums"><div class="note">—</div></div>
      <h2>Top tracks</h2><div id="aTop"><div class="note">—</div></div>`;
    drawAlbums(document.getElementById("aAlbums"), d.albums);
    drawTracks(document.getElementById("aTop"), d.top);
    document.getElementById("topBtn").addEventListener("click", e =>
      bulkDownload(e.target, "/api/download-artist", { artist_id: d.artist_id, mode: "top" }, d.name + " — top 25"));
    document.getElementById("allBtn").addEventListener("click", e => {
      if (confirm("This queues EVERY album by " + d.name + " — possibly hundreds of tracks over several hours. Continue?"))
        bulkDownload(e.target, "/api/download-artist", { artist_id: d.artist_id, mode: "albums" }, d.name + " — all albums");
    });
    document.getElementById("backBtn").addEventListener("click", () => document.getElementById("searchForm").requestSubmit());
  } catch { resultsEl.innerHTML = '<div class="note err">Could not load the artist page.</div>'; }
}

// ── CSV mode ──
function csvUi() {
  resultsEl.innerHTML = `
    <div class="card" style="display:block;">
      <div class="name" style="margin-bottom:0.4rem;">📄 Bulk download from a CSV file</div>
      <div class="note" style="margin-bottom:0.7rem;">
        Accepted formats: <b>Exportify</b> (Spotify playlists), iTunes exports, Google Takeout's
        <code>music-library-songs.csv</code> — columns are detected from the header.
        A plain headerless list works too, in this order: <code>artist, title</code> (album optional).
        Max 400 rows. Rows are matched first — <b>nothing downloads until you confirm the preview.</b>
      </div>
      <input type="file" id="csvFile" accept=".csv,text/csv">
      <div class="note" id="csvStatus" style="margin-top:0.5rem;"></div>
    </div>
    <div id="csvResult"></div>`;
  document.getElementById("csvFile").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById("csvStatus");
    statusEl.textContent = "⏳ matching — every row is looked up on Deezer, large files can take a few minutes…";
    try {
      const text = await file.text();
      const r = await fetch("/api/csv-match", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ csv: text }) });
      if (!r.ok) throw new Error((await r.json()).detail || "could not parse the file");
      csvPreview(await r.json());
      statusEl.textContent = "";
    } catch (err) { statusEl.innerHTML = '<span class="err">⚠️ ' + esc(err.message || "could not parse the file") + "</span>"; }
  });
}

function csvPreview(d) {
  const area = document.getElementById("csvResult");
  const hits = d.rows.filter(r => r.match);
  const misses = d.rows.filter(r => !r.match);
  area.innerHTML = `
    <h2>Preview — ${d.matched}/${d.total} rows matched</h2>
    ${hits.length ? `<button class="btn" id="csvQueue" style="margin-bottom:0.7rem; background:var(--accent); color:#16161e; font-weight:600;">⬇ Queue the ${hits.length} matched track(s)</button>` : ""}
    <div id="csvHits"></div>
    ${misses.length ? `<h2 class="err">Unmatched (${misses.length}) — search these manually in the Track tab</h2>` +
      misses.map(r => `<div class="row queue"><div class="what err">row ${r.row}: ${esc(r.csv_artist)} — ${esc(r.csv_title)}</div></div>`).join("") : ""}`;
  drawTracks(document.getElementById("csvHits"), hits.map(r => r.match));
  const btn = document.getElementById("csvQueue");
  if (btn) btn.addEventListener("click", () =>
    bulkDownload(btn, "/api/download-list",
      { tracks: hits.map(r => ({ deezer_id: r.match.deezer_id, title: r.match.title, artist: r.match.artist, album: r.match.album })) },
      "CSV list"));
}

// ── queue ──
async function refreshQueue() {
  try {
    const d = await (await fetch("/api/queue")).json();
    if (!d.jobs.length) { queueEl.innerHTML = '<div class="note">Nothing downloaded yet.</div>'; return; }
    queueEl.innerHTML = (d.pending > 0 ? `<div class="note busy" style="padding:0.3rem 0;">⏳ ${d.pending} track(s) waiting in the queue</div>` : "") +
      d.jobs.map(j => {
        const [m, cls] = STATUS_TEXT[j.status] || [j.status, ""];
        return `<div class="row"><div class="status ${cls}">${m}</div>
          <div class="what" title="${esc(j.error || "")}">${esc(j.artist)} — ${esc(j.title)} <span class="note">(${esc(j.album)})</span></div>
          ${j.status === "error" ? `<button class="btn" data-retry="${j.id}" title="${esc(j.error || "")} — retry" style="padding:0.1rem 0.45rem; font-size:0.85rem;">🔁</button>` : ""}
          <div class="when">${esc((j.finished || j.added || "").slice(5, 16))}</div></div>`;
      }).join("");
    queueEl.querySelectorAll("button[data-retry]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "⏳";
      try { await fetch("/api/retry/" + b.dataset.retry, { method: "POST" }); } catch {}
      setTimeout(refreshQueue, 800);
    }));
    if (d.pending > 0) setTimeout(refreshQueue, 5000);
  } catch { queueEl.innerHTML = '<div class="note err">Could not read the queue.</div>'; }
}

// ── mode switch + search ──
document.getElementById("modes").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.getElementById("modes").querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
  document.getElementById("searchForm").style.display = mode === "csv" ? "none" : "flex";
  if (mode === "csv") { csvUi(); return; }
  document.getElementById("searchBox").placeholder = PLACEHOLDER[mode];
  const q = document.getElementById("searchBox").value.trim();
  if (q) document.getElementById("searchForm").requestSubmit();
}));

document.getElementById("searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("searchBox").value.trim();
  if (!q) return;
  resultsEl.innerHTML = '<div class="note">⏳ searching…</div>';
  try {
    if (mode === "track") drawTracks(resultsEl, (await (await fetch("/api/search?q=" + encodeURIComponent(q))).json()).results);
    else if (mode === "album") drawAlbums(resultsEl, (await (await fetch("/api/search-album?q=" + encodeURIComponent(q))).json()).results);
    else drawArtists(resultsEl, (await (await fetch("/api/search-artist?q=" + encodeURIComponent(q))).json()).results);
  } catch { resultsEl.innerHTML = '<div class="note err">Search failed — could not reach Deezer.</div>'; }
});

(async () => {
  try { drawTracks(resultsEl, (await (await fetch("/api/popular")).json()).results); }
  catch { resultsEl.innerHTML = '<div class="note">Could not load the popular chart — search still works.</div>'; }
  refreshQueue();
})();
</script>
</body>
</html>
